name: Release

# The repo has immutable releases enabled: assets can't be added to a published
# release. So the `release` job creates the Release as a draft if one doesn't
# exist yet, the `build` matrix attaches binaries to the draft, and `publish`
# publishes it only once every build succeeded.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release view "${{ github.ref_name }}" || gh release create "${{ github.ref_name }}" --draft --verify-tag --generate-notes

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          OUT="doppler-backup-${{ github.ref_name }}-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          mkdir -p dist
          go build -ldflags "-X main.Version=${{ github.ref_name }}" -o "dist/${OUT}" ./cmd/doppler-backup

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${{ github.ref_name }}" --draft=false
