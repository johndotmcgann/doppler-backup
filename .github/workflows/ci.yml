name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Fmt
        run: test -z "$(gofmt -l .)"

      - name: Test
        run: go test ./...

      # Last on purpose: it hits the vuln.go.dev database, so a network flake
      # here shouldn't stop vet/fmt/test from reporting their own results.
      - name: Vuln
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
